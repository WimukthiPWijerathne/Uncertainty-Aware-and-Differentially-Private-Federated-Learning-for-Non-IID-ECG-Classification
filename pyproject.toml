[project]
name = "uncertainty-aware-and-differentially-private-federated-learning-for-non-iid-ecg-classification"
version = "0.1.0"
description = "Uncertainty-aware, differentially private federated learning for ECG classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "flwr>=1.8",
    "matplotlib",
    "numpy",
    "opacus>=1.4",
    "pandas",
    "pyyaml>=6.0.3",
    "scikit-learn",
    "scipy>=1.18.0",
    "torch",
    "tqdm",
    "wfdb",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }